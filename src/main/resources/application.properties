spring.application.name=code-review
server.port=${SERVER_PORT:8190}
server.servlet.context-path=/code-review

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_CONFIG_DB:probestack-forgesphere}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX:false}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=info,health
management.endpoint.health.show-details=always

# Reads the selected SCM credentials + review team from CI/CD config.
cicd.service.url=${CICD_SERVICE_URL:https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config}

# GitHub REST API root (override for GitHub Enterprise Server: https://<host>/api/v3).
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}

# Approvals required before the platform will merge a PR when the request
# does not specify its own value.
code-review.default-min-approvals=${CODE_REVIEW_MIN_APPROVALS:1}

# Roles (besides the PR's own author) allowed to merge from the platform.
code-review.admin-roles=${CODE_REVIEW_ADMIN_ROLES:ADMIN,ORG_ADMIN,OWNER,SUPER_ADMIN}

forge.authn.enabled=${FORGE_AUTHN_ENABLED:true}
forge.authn.issuer-uri=${FORGE_AUTHN_ISSUER_URI:https://auth.probestack.io}
forge.authn.audience=${FORGE_AUTHN_AUDIENCE:probestack-api}
forge.authn.jwks-uri=${FORGE_AUTHN_JWKS_URI:https://probestack.io/admin-backend/api/public/users/context-token/jwks}
forge.authn.jwks-cache-duration-hours=24
forge.authn.connect-timeout-ms=3000
forge.authn.read-timeout-ms=5000
# Read only when there's no Authorization header on the request at all — native library
# support, no hand-rolled cookie-to-header bridge filter needed here any more.
forge.authn.token-cookie-name=${AUTH_COOKIE_NAME:ps_auth_token}

# ==================================================
# Outbound service-to-service token (ps-token-issuer-svc)
# Used by CicdConfigClient to call fsp-cicd-automation-svc as this service, not with no
# auth at all (fsp-cicd-automation-svc does not yet enforce this — registering and
# sending the token now means no further change is needed once it does).
# ==================================================
forge.service-token.enabled=${FORGE_SERVICE_TOKEN_ENABLED:true}
forge.service-token.token-url=${TOKEN_ISSUER_TOKEN_URL:https://probestack.io/token-issuer-api/api/v1/service-tokens}
forge.service-token.client-id=${TOKEN_ISSUER_CLIENT_ID:fsp-code-review-svc}
forge.service-token.client-secret=${TOKEN_ISSUER_CLIENT_SECRET:}
forge.service-token.audience=${TOKEN_ISSUER_AUDIENCE:probestack-api}
forge.service-token.scope=${TOKEN_ISSUER_SCOPE:cicd:config:read}

forge.logging.enabled=true
forge.logging.exclude-endpoints=/actuator/**,/health,/info
forge.logging.mask-header-keys=Authorization,Cookie,X-API-Key,X-Auth-Token
forge.logging.mask-request-keys=password,secret,token,pat,apiKey,privateKey,clientSecret
forge.logging.mask-response-keys=password,secret,token,pat,apiKey,privateKey,clientSecret
forge.logging.json-log-format=false
forge.logging.masking-logs-enabled=true
forge.logging.filter-order=10
